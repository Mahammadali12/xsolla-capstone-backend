basePath: /
definitions:
  dto.AnalyticsOverviewResponse:
    properties:
      generated_at:
        type: string
      period:
        $ref: '#/definitions/dto.AnalyticsPeriodResponse'
      weeks:
        items:
          $ref: '#/definitions/dto.AnalyticsWeekResponse'
        type: array
    type: object
  dto.AnalyticsPeriodResponse:
    properties:
      from:
        type: string
      to:
        type: string
    type: object
  dto.AnalyticsPersonResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  dto.AnalyticsWeekResponse:
    properties:
      green_count:
        type: integer
      module_id:
        type: integer
      module_title:
        type: string
      opens_at:
        type: string
      red_count:
        type: integer
      total_count:
        type: integer
      yellow_count:
        type: integer
    type: object
  dto.AssignmentStatusResponse:
    properties:
      eligible_count:
        type: integer
      late_count:
        type: integer
      missing_count:
        type: integer
      on_time_count:
        type: integer
    type: object
  dto.AuthResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.AvatarResponse:
    properties:
      avatar_url:
        type: string
    type: object
  dto.ContentItemResponse:
    properties:
      children:
        items:
          $ref: '#/definitions/dto.ContentItemResponse'
        type: array
      created_at:
        type: string
      description:
        type: string
      due_at:
        type: string
      file_id:
        type: integer
      id:
        type: integer
      is_visible:
        type: boolean
      parent_id:
        type: integer
      position:
        type: integer
      title:
        type: string
      type:
        type: string
      url:
        type: string
    type: object
  dto.ContentTreeNode:
    properties:
      children:
        items:
          $ref: '#/definitions/dto.ContentTreeNode'
        type: array
      description:
        type: string
      due_at:
        type: string
      file_id:
        type: integer
      id:
        type: integer
      is_visible:
        type: boolean
      position:
        type: integer
      title:
        type: string
      type:
        type: string
      url:
        type: string
    type: object
  dto.CreateContentItemRequest:
    properties:
      description:
        type: string
      due_at:
        type: string
      file_id:
        type: integer
      is_visible:
        type: boolean
      parent_id:
        type: integer
      position:
        type: integer
      title:
        type: string
      type:
        type: string
      url:
        type: string
    type: object
  dto.CreateModuleRequest:
    properties:
      closes_at:
        type: string
      description:
        type: string
      opens_at:
        type: string
      title:
        type: string
    type: object
  dto.EnrollRequest:
    properties:
      user_id:
        type: integer
    type: object
  dto.EnrollmentResponse:
    properties:
      created_at:
        type: string
      feedback:
        description: |-
          Feedback is the mentor's module feedback that came with the grade, GradedAt when the grade was last written
          (both left out for a week graded before they were kept, and Feedback for other students' enrollments).
        type: string
      grade:
        type: string
      graded_at:
        type: string
      id:
        type: integer
      module_id:
        type: integer
      user_id:
        type: integer
    type: object
  dto.FeedbackDimensionResponse:
    properties:
      average:
        type: number
      count:
        type: integer
      dimension:
        type: string
    type: object
  dto.FileResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      mime_type:
        type: string
      original_name:
        type: string
      size_bytes:
        type: integer
      storage_key:
        type: string
    type: object
  dto.GoogleCalendarEventResponse:
    properties:
      all_day:
        type: boolean
      description:
        type: string
      ends_at:
        description: EndsAt is RFC 3339, or the last covered day (inclusive) for all-day
          events.
        type: string
      html_link:
        type: string
      id:
        type: string
      location:
        type: string
      meeting_url:
        type: string
      starts_at:
        description: StartsAt is RFC 3339 for timed events, YYYY-MM-DD for all-day
          ones.
        type: string
      title:
        type: string
    type: object
  dto.GradeEnrollmentRequest:
    properties:
      feedback:
        description: 'the mentor''s module feedback: required, 1 to 1000 characters'
        type: string
      grade:
        type: string
    type: object
  dto.LectureFeedbackPersonResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  dto.LectureFeedbackRequest:
    properties:
      clarity:
        type: integer
      confidence:
        type: integer
      event_id:
        type: integer
      improve:
        type: string
      liked:
        type: string
      overall:
        type: integer
      pace:
        type: string
      practice:
        type: integer
    type: object
  dto.LectureFeedbackResponse:
    properties:
      clarity:
        type: integer
      confidence:
        type: integer
      id:
        type: integer
      improve:
        type: string
      lecture:
        $ref: '#/definitions/dto.LectureRef'
      lecturers:
        items:
          $ref: '#/definitions/dto.LectureFeedbackPersonResponse'
        type: array
      liked:
        type: string
      overall:
        type: integer
      pace:
        type: string
      practice:
        type: integer
      student:
        $ref: '#/definitions/dto.LectureFeedbackPersonResponse'
      submitted_at:
        type: string
    type: object
  dto.LectureFeedbackSummaryResponse:
    properties:
      averages:
        additionalProperties:
          format: float64
          type: number
        type: object
      expected:
        type: integer
      lecture:
        $ref: '#/definitions/dto.LectureRef'
      lecturers:
        items:
          $ref: '#/definitions/dto.LectureFeedbackPersonResponse'
        type: array
      pace:
        additionalProperties:
          type: integer
        type: object
      responses:
        type: integer
      with_comments:
        type: integer
    type: object
  dto.LectureRef:
    properties:
      ends_at:
        type: string
      event_id:
        type: integer
      module_id:
        type: integer
      module_title:
        type: string
      starts_at:
        type: string
      title:
        type: string
    type: object
  dto.LoginRequest:
    properties:
      login:
        example: alice@xsolla.com
        type: string
      password:
        example: secret123
        type: string
    type: object
  dto.LogoutRequest:
    properties:
      refresh_token:
        type: string
    type: object
  dto.MentorAnalyticsResponse:
    properties:
      feedback_by_dimension:
        items:
          $ref: '#/definitions/dto.FeedbackDimensionResponse'
        type: array
      generated_at:
        type: string
      mentor:
        $ref: '#/definitions/dto.AnalyticsPersonResponse'
      period:
        $ref: '#/definitions/dto.AnalyticsPeriodResponse'
      standing_attribution:
        type: string
      student_standing_by_week:
        items:
          $ref: '#/definitions/dto.AnalyticsWeekResponse'
        type: array
    type: object
  dto.MentorReviewRatingsResponse:
    properties:
      clarity:
        type: integer
      comfort:
        type: integer
      engagement:
        type: integer
      time:
        type: integer
    type: object
  dto.MentorReviewRequest:
    properties:
      comment:
        type: string
      had_session:
        type: boolean
      module_id:
        type: integer
      no_session_reason:
        type: string
      other_topic:
        type: string
      overall:
        type: integer
      ratings:
        additionalProperties:
          type: integer
        type: object
      topics:
        items:
          type: string
        type: array
    type: object
  dto.MentorReviewResponse:
    properties:
      comment:
        type: string
      had_session:
        type: boolean
      id:
        type: integer
      mentor:
        $ref: '#/definitions/dto.ReviewPerson'
      module_id:
        type: integer
      module_title:
        type: string
      no_session_reason:
        type: string
      other_topic:
        type: string
      overall:
        type: integer
      ratings:
        $ref: '#/definitions/dto.MentorReviewRatingsResponse'
      student:
        $ref: '#/definitions/dto.ReviewPerson'
      submitted_at:
        type: string
      team:
        $ref: '#/definitions/dto.ReviewTeam'
      topics:
        items:
          type: string
        type: array
    type: object
  dto.MentorReviewSummaryResponse:
    properties:
      averages:
        additionalProperties:
          format: float64
          type: number
        type: object
      expected:
        type: integer
      mentor:
        $ref: '#/definitions/dto.ReviewPerson'
      module_id:
        type: integer
      module_title:
        type: string
      no_session:
        type: integer
      no_session_reasons:
        additionalProperties:
          type: integer
        type: object
      reviews:
        type: integer
      sessions_held:
        type: integer
      topics:
        additionalProperties:
          type: integer
        type: object
    type: object
  dto.MissingReviewResponse:
    properties:
      mentor:
        $ref: '#/definitions/dto.ReviewPerson'
      student:
        $ref: '#/definitions/dto.ReviewPerson'
      team:
        $ref: '#/definitions/dto.ReviewTeam'
    type: object
  dto.ModuleResponse:
    properties:
      closes_at:
        type: string
      created_at:
        type: string
      created_by:
        type: integer
      description:
        type: string
      grade:
        type: string
      id:
        type: integer
      opens_at:
        type: string
      title:
        type: string
    type: object
  dto.PasswordResetRequest:
    properties:
      new_password:
        example: Back-To-Class-8
        type: string
      old_password:
        example: secret123
        type: string
    type: object
  dto.PendingLectureResponse:
    properties:
      closes_at:
        type: string
      ends_at:
        type: string
      event_id:
        type: integer
      module_id:
        type: integer
      module_title:
        type: string
      starts_at:
        type: string
      title:
        type: string
    type: object
  dto.ProfileResponse:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      gitlab_handle:
        type: string
      slack_handle:
        type: string
      visibility:
        type: string
    type: object
  dto.QuizAccuracyResponse:
    properties:
      accuracy:
        type: number
      attempt_count:
        type: integer
      module_id:
        type: integer
      module_title:
        type: string
      opens_at:
        type: string
      possible_total:
        type: integer
      score_total:
        type: integer
    type: object
  dto.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  dto.ReviewPerson:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  dto.ReviewTeam:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  dto.ReviewedWeekResponse:
    properties:
      module_id:
        type: integer
      submitted_at:
        type: string
    type: object
  dto.SentLectureFeedbackResponse:
    properties:
      event_id:
        type: integer
      submitted_at:
        type: string
    type: object
  dto.SignupRequest:
    properties:
      email:
        example: alice@xsolla.com
        type: string
      name:
        example: Alice
        type: string
      password:
        example: secret123
        type: string
    type: object
  dto.StudentAnalyticsResponse:
    properties:
      assignment_status:
        $ref: '#/definitions/dto.AssignmentStatusResponse'
      generated_at:
        type: string
      period:
        $ref: '#/definitions/dto.AnalyticsPeriodResponse'
      quiz_accuracy_by_module:
        items:
          $ref: '#/definitions/dto.QuizAccuracyResponse'
        type: array
      student:
        $ref: '#/definitions/dto.AnalyticsPersonResponse'
    type: object
  dto.TokenResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  dto.UpdateContentItemRequest:
    properties:
      description:
        type: string
      due_at:
        type: string
      file_id:
        type: integer
      is_visible:
        type: boolean
      parent_id:
        type: integer
      position:
        type: integer
      title:
        description: 'nil = not sent: the stored value stays'
        type: string
      url:
        type: string
    type: object
  dto.UpdateModuleRequest:
    properties:
      closes_at:
        type: string
      description:
        type: string
      opens_at:
        type: string
      title:
        type: string
    type: object
  dto.UserResponse:
    properties:
      avatar_url:
        description: AvatarURL is the profile picture as the caller may see it; null
          when none or hidden.
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      left_at:
        type: string
      name:
        type: string
      role_expires_at:
        additionalProperties:
          type: string
        type: object
      roles:
        items:
          type: string
        type: array
    type: object
  handlers.ErrorDetail:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  handlers.ErrorResponse:
    properties:
      details:
        items:
          $ref: '#/definitions/handlers.ErrorDetail'
        type: array
      error:
        type: string
      message:
        type: string
      status:
        type: integer
    type: object
  handlers.googleUserInfo:
    properties:
      email:
        type: string
      family_name:
        type: string
      given_name:
        type: string
      hd:
        type: string
      id:
        type: string
      locale:
        type: string
      name:
        type: string
      picture:
        type: string
      verified_email:
        type: boolean
    type: object
host: localhost:8080
info:
  contact:
    email: support@xsolla.com
    name: Xsolla School LMS
    url: https://xsolla.com
  description: API for Xsolla School LMS - Courses, Content Items, Submissions, and
    File Uploads
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Xsolla School LMS API
  version: "1.0"
paths:
  /analytics/mentors:
    get:
      description: Active mentors matching q, id/name/email only.
      parameters:
      - description: Name or email fragment
        in: query
        name: q
        type: string
      - description: Page size, 1-100 (default 20)
        in: query
        name: limit
        type: integer
      - description: Rows to skip (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.AnalyticsPersonResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Mentor selector (admin)
      tags:
      - analytics
  /analytics/mentors/{mentorId}:
    get:
      description: Averages are over submitted reviews in the period, per dimension,
        and null when nobody rated it. Weekly standing uses today's team membership
        (standing_attribution).
      parameters:
      - description: Mentor user id
        in: path
        name: mentorId
        required: true
        type: integer
      - description: Start date, YYYY-MM-DD (inclusive)
        in: query
        name: from
        type: string
      - description: End date, YYYY-MM-DD (inclusive)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MentorAnalyticsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: One mentor's feedback averages and students' standing (admin)
      tags:
      - analytics
  /analytics/overview:
    get:
      description: Green/yellow/red counts per module (week). Total counts only students
        with a recorded grade; weeks without grades have zero counts.
      parameters:
      - description: Start date, YYYY-MM-DD (inclusive)
        in: query
        name: from
        type: string
      - description: End date, YYYY-MM-DD (inclusive)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AnalyticsOverviewResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Weekly student standing, school-wide (admin)
      tags:
      - analytics
  /analytics/students:
    get:
      description: Active students matching q, id/name/email only.
      parameters:
      - description: Name or email fragment
        in: query
        name: q
        type: string
      - description: Page size, 1-100 (default 20)
        in: query
        name: limit
        type: integer
      - description: Rows to skip (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.AnalyticsPersonResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Student selector (admin)
      tags:
      - analytics
  /analytics/students/{studentId}:
    get:
      description: Assignment deadlines in the period are classified by the student's
        first submission; quiz accuracy is sum(score)/sum(total) per module.
      parameters:
      - description: Student user id
        in: path
        name: studentId
        required: true
        type: integer
      - description: Start date, YYYY-MM-DD (inclusive)
        in: query
        name: from
        type: string
      - description: End date, YYYY-MM-DD (inclusive)
        in: query
        name: to
        type: string
      - description: Only this module (week)
        in: query
        name: module_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.StudentAnalyticsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: One student's submission status and quiz accuracy (admin)
      tags:
      - analytics
  /auth/google/callback:
    get:
      description: Handle Google OAuth redirect, exchange code for tokens, store encrypted
        refresh token
      produces:
      - text/html
      responses:
        "302":
          description: Redirect to frontend
          schema:
            type: string
      summary: Google OAuth callback
      tags:
      - auth
  /auth/google/login:
    get:
      description: Redirect user to Google consent screen to connect their Google
        account
      produces:
      - text/html
      responses:
        "302":
          description: Redirect to Google
          schema:
            type: string
      summary: Google OAuth login
      tags:
      - auth
  /auth/google/logout:
    post:
      description: Remove the signed-in user's Google OAuth credentials from the application
      produces:
      - application/json
      responses:
        "204":
          description: No content
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Disconnect Google account
      tags:
      - auth
  /auth/google/me:
    get:
      description: Return the connected Google account profile for the signed-in user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.googleUserInfo'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Google user profile
      tags:
      - auth
  /auth/google/revoke:
    post:
      description: Revoke the signed-in user's Google OAuth grant at Google, then
        remove the stored credentials
      produces:
      - application/json
      responses:
        "204":
          description: No content
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Revoke Google access
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate with email and password to receive JWT and refresh
        tokens
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Log in
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revoke the refresh token
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LogoutRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No content
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Log out
      tags:
      - auth
  /auth/password-reset:
    post:
      consumes:
      - application/json
      description: Replace the signed-in user's password
      parameters:
      - description: New password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.PasswordResetRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No content
          schema:
            type: string
