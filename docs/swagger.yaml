basePath: /
definitions:
  dto.AuthResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.ContentItemResponse:
    properties:
      children:
        items:
          $ref: '#/definitions/dto.ContentItemResponse'
        type: array
      created_at:
        type: string
      description:
        type: string
      due_at:
        type: string
      file_id:
        type: integer
      id:
        type: integer
      is_visible:
        type: boolean
      max_points:
        type: integer
      parent_id:
        type: integer
      position:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
  dto.ContentTreeNode:
    properties:
      children:
        items:
          $ref: '#/definitions/dto.ContentTreeNode'
        type: array
      description:
        type: string
      due_at:
        type: string
      file_id:
        type: integer
      id:
        type: integer
      is_visible:
        type: boolean
      max_points:
        type: integer
      position:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
  dto.CreateContentItemRequest:
    properties:
      description:
        type: string
      due_at:
        type: string
      file_id:
        type: integer
      is_visible:
        type: boolean
      max_points:
        type: integer
      parent_id:
        type: integer
      position:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
  dto.CreateModuleRequest:
    properties:
      description:
        type: string
      title:
        type: string
    type: object
  dto.EnrollRequest:
    properties:
      user_id:
        type: integer
    type: object
  dto.EnrollmentResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      module_id:
        type: integer
      user_id:
        type: integer
    type: object
  dto.FileResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      mime_type:
        type: string
      original_name:
        type: string
      size_bytes:
        type: integer
      storage_key:
        type: string
    type: object
  dto.LoginRequest:
    properties:
      login:
        example: alice@xsolla.com
        type: string
      password:
        example: secret123
        type: string
    type: object
  dto.LogoutRequest:
    properties:
      refresh_token:
        type: string
    type: object
  dto.ModuleResponse:
    properties:
      created_at:
        type: string
      created_by:
        type: integer
      description:
        type: string
      id:
        type: integer
      title:
        type: string
    type: object
  dto.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  dto.SignupRequest:
    properties:
      email:
        example: alice@xsolla.com
        type: string
      name:
        example: Alice
        type: string
      password:
        example: secret123
        type: string
    type: object
  dto.TokenResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  dto.UpdateContentItemRequest:
    properties:
      description:
        type: string
      due_at:
        type: string
      file_id:
        type: integer
      is_visible:
        type: boolean
      parent_id:
        type: integer
      position:
        type: integer
      title:
        type: string
    type: object
  dto.UpdateModuleRequest:
    properties:
      description:
        type: string
      title:
        type: string
    type: object
  dto.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      roles:
        items:
          type: string
        type: array
    type: object
  handlers.ErrorDetail:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  handlers.ErrorResponse:
    properties:
      details:
        items:
          $ref: '#/definitions/handlers.ErrorDetail'
        type: array
      error:
        type: string
      message:
        type: string
      status:
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    email: support@xsolla.com
    name: Xsolla School LMS
    url: https://xsolla.com
  description: API for Xsolla School LMS - Courses, Content Items, Submissions, and
    File Uploads
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Xsolla School LMS API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate with email and password to receive JWT and refresh
        tokens
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Log in
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revoke the refresh token
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LogoutRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No content
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Log out
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Rotate the refresh token and receive a new JWT
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Refresh access token
      tags:
      - auth
  /auth/signup:
    post:
      consumes:
      - application/json
      description: Create a new user account. First user becomes admin, @xsolla.com
        emails become teacher, rest are student.
      parameters:
      - description: Registration credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SignupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Sign up
      tags:
      - auth
  /content-items/{id}:
    delete:
      description: Soft-delete a content item (teacher or admin only)
      parameters:
      - description: Content item ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No content
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete content item
      tags:
      - content-items
    get:
      description: Get a single content item by ID
      parameters:
      - description: Content item ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ContentItemResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get content item
      tags:
      - content-items
    patch:
      consumes:
      - application/json
      description: Update content item fields (teacher or admin only)
      parameters:
      - description: Content item ID
        in: path
        name: id
        required: true
        type: integer
      - description: Content item updates
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateContentItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ContentItemResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update content item
      tags:
      - content-items
  /files:
    post:
      consumes:
      - multipart/form-data
      description: Upload a file (pdf, pptx, md, zip, images) and store it on disk
      parameters:
      - description: File to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.FileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload file
      tags:
      - files
  /modules:
    get:
      description: Get modules the user is enrolled in (student), teaching (teacher),
        or all (admin)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.ModuleResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List modules
      tags:
      - modules
    post:
      consumes:
      - application/json
      description: Create a new module (teacher or admin only). The creator is auto-enrolled
        as teacher.
      parameters:
      - description: Module details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateModuleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ModuleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create module
      tags:
      - modules
  /modules/{id}:
    delete:
      description: Soft-delete a module (teacher or admin only)
      parameters:
      - description: Module ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No content
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete module
      tags:
      - modules
    get:
      description: Get module details if the user is enrolled or is the teacher
      parameters:
      - description: Module ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ModuleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get module by ID
      tags:
      - modules
    patch:
      consumes:
      - application/json
      description: Update module title/description (teacher or admin only)
      parameters:
      - description: Module ID
        in: path
        name: id
        required: true
        type: integer
      - description: Module details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateModuleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ModuleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update module
      tags:
      - modules
  /modules/{moduleId}/content-items:
    get:
      description: Get the content tree for a module (files, assignments)
      parameters:
      - description: Module ID
        in: path
        name: moduleId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.ContentTreeNode'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List content items
      tags:
      - content-items
    post:
      consumes:
      - application/json
      description: Create a file or assignment (teacher or admin only)
      parameters:
      - description: Module ID
        in: path
        name: moduleId
        required: true
        type: integer
      - description: Content item details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateContentItemRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ContentItemResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create content item
      tags:
      - content-items
  /modules/{moduleId}/enrollments:
    get:
      description: Get all enrollments for a module (members must be enrolled/teacher/admin)
      parameters:
      - description: Module ID
        in: path
        name: moduleId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.EnrollmentResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List module enrollments
      tags:
      - enrollments
    post:
      consumes:
      - application/json
      description: Enroll a user in a module. Students can only enroll themselves,
        teachers/admins can enroll anyone
      parameters:
      - description: Module ID
        in: path
        name: moduleId
        required: true
        type: integer
      - description: User ID to enroll
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.EnrollRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.EnrollmentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Enroll in module
      tags:
      - enrollments
  /modules/{moduleId}/enrollments/{userId}:
    delete:
      description: Remove a user from a module. Students can only unenroll themselves
      parameters:
      - description: Module ID
        in: path
        name: moduleId
        required: true
        type: integer
      - description: User ID
        in: path
        name: userId
        required: true
        type: integer
      responses:
        "204":
          description: No content
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Unenroll from module
      tags:
      - enrollments
  /users/me:
    get:
      description: Get the currently authenticated user profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - users
securityDefinitions:
  ApiKeyAuth:
    description: 'Enter your JWT token as: Bearer <token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
