            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Unenroll from module
      tags:
      - enrollments
  /modules/{moduleId}/enrollments/{userId}/grade:
    patch:
      consumes:
      - application/json
      description: |-
        Set a student's module grade red/yellow/green with the mentor's module feedback (required, 1 to 1000
        characters). A new grade replaces the old grade and feedback. Mentor of the student or admin only.
      parameters:
      - description: Module ID
        in: path
        name: moduleId
        required: true
        type: integer
      - description: Student ID
        in: path
        name: userId
        required: true
        type: integer
      - description: Grade
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.GradeEnrollmentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.EnrollmentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Grade enrollment
      tags:
      - enrollments
  /users/{id}/profile:
    get:
      description: 'As the caller may see it: a "staff_only" profile comes back empty
        (avatar_url null) to students'
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ProfileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Someone's profile
      tags:
      - profile
  /users/me:
    get:
      description: Get the currently authenticated user profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - users
  /users/me/avatar:
    delete:
      responses:
        "204":
          description: No content
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Remove my picture
      tags:
      - profile
    put:
      consumes:
      - multipart/form-data
      description: JPG, PNG or WebP up to 2 MB (content is checked). Replaces and
        deletes the old picture.
      parameters:
      - description: The picture
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AvatarResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload my picture
      tags:
      - profile
  /users/me/preferences:
    get:
      description: Every setting; defaults for a person who never saved any
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: My look and accessibility settings
      tags:
      - profile
    patch:
      consumes:
      - application/json
      description: text_size (normal, large, xlarge), theme (system, light, dark),
        font (default, dyslexia), spacing (normal, relaxed), density (comfortable,
        compact), high_contrast, colorblind_safe, reduce_motion, strong_focus (true/false)
      parameters:
      - description: Settings to change
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change my look and accessibility settings
      tags:
      - profile
  /users/me/profile:
    get:
      description: 'The signed-in person''s "about me": picture, bio, contact handles
        and who may see them'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ProfileResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: My profile
      tags:
      - profile
    patch:
      consumes:
      - application/json
      description: Any of bio (max 300), slack_handle, gitlab_handle (max 40, no spaces),
        visibility (everyone, staff_only). Only sent fields change.
      parameters:
      - description: Fields to change
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ProfileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change my profile
      tags:
      - profile
securityDefinitions:
  ApiKeyAuth:
    description: 'Enter your JWT token as: Bearer <token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
