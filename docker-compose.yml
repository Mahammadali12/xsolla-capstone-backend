services:
  db:
    image: postgres:16-alpine
    container_name: lms-db
    environment:
      POSTGRES_USER: maqa
      POSTGRES_PASSWORD: maqa
      POSTGRES_DB: lms
    ports:
      - "5432:5432"
    volumes:
      - lms_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maqa -d lms"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lms_db_data:
