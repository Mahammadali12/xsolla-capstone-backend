services:
  db:
    image: postgres:16-alpine
    container_name: lms-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lms
    ports:
      - "5432:5432"
    volumes:
      - lms_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lms"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: .
    container_name: lms-api
    restart: unless-stopped
    # the app exits on its own if Postgres is not ready, so wait for the healthcheck
    depends_on:
      db:
        condition: service_healthy
    # S3 and Google credentials come from .env; Compose needs that file to exist.
    env_file: .env
    environment:
      # the container reaches Postgres by service name, not by 127.0.0.1
      DATABASE_URL: host=db port=5432 user=postgres password=postgres dbname=lms sslmode=disable
      PORT: ":8080"
      CORS_ORIGIN: http://localhost:5173
      # The notification stack's broker is published on the host, not in this compose file.
      RABBITMQ_URL: amqp://guest:guest@host.docker.internal:5672/
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    healthcheck:
      # any answer, even 401, means the HTTP server is up
      test: ["CMD-SHELL", "wget -qS -O /dev/null http://localhost:8080/mentor-slots 2>&1 | grep -q 'HTTP/'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  lms_db_data:
