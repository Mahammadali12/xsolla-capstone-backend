# ==============================================================================
# 1. LMS FRONTEND (xsolla-capstone-frontend)
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: lms-frontend
  namespace: xsolla
  labels:
    app: lms-frontend
spec:
  ports:
    - port: 80
      name: http
      targetPort: 80
  selector:
    app: lms-frontend
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms-frontend
  namespace: xsolla
  labels:
    app: lms-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lms-frontend
  template:
    metadata:
      labels:
        app: lms-frontend
    spec:
      containers:
        - name: lms-frontend
          image: mahammadalii12/xsolla-capstone-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          envFrom:
            - configMapRef:
                name: lms-frontend-config
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

---
