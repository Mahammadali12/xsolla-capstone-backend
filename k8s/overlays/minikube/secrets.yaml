apiVersion: v1
kind: Secret
metadata:
  name: xsolla-secrets
  namespace: xsolla
type: Opaque
stringData:
  # Database Credentials & Connection Strings
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  DATABASE_URL: "host=postgres port=5432 user=postgres password=postgres dbname=lms sslmode=disable"
  NOTIFY_DATABASE_URL: "host=postgres port=5432 user=notify password=notify dbname=notify sslmode=disable"
  EXPLORER_DATABASE_URL: "postgres://postgres:postgres@postgres:5432/xsolla_explorer?sslmode=disable"

  # Message Broker
  RABBITMQ_URL: "amqp://lms:lms@rabbitmq:5672/"
  RABBITMQ_DEFAULT_USER: "lms"
  RABBITMQ_DEFAULT_PASS: "lms"

  # Auth Secrets
  JWT_ACCESS_SECRET: "dev-access-secret-change-me-in-production"
  JWT_REFRESH_SECRET: "dev-refresh-secret-change-me-in-production"

  # S3 Object Storage
  S3_ENDPOINT: "Replace"
  S3_BUCKET: "Xsolla-LMS-Files"
  S3_REGION: "ap-south-1"
  S3_ACCESS_KEY: "Replace"
  S3_SECRET_KEY: "Replace"

  # Google OAuth
  GOOGLE_OAUTH_CLIENT_ID: "Replace"
  GOOGLE_OAUTH_CLIENT_SECRET: "Replace"
  GOOGLE_OAUTH_REDIRECT_URI: "http://api.lms.mahammadali.me/auth/google/callback"
  GOOGLE_TOKEN_ENCRYPTION_KEY: "Replace"
  GOOGLE_OAUTH_FRONTEND_REDIRECT_URI: "http://lms.mahammadali.me/settings"

  # Gemini AI
  GEMINI_API_KEY: "ALREADY_LEAKED_KEY"
  GEMINI_MODEL: "gemini-3.6-flash"

  # SMTP (Empty by default in dev; worker logs deliveries)
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_USERNAME: "zamanli.mahammadali@gmail.com"
  SMTP_PASSWORD: "uxwxfrxsdmxesmsm"
  SMTP_FROM: "zamanli.mahammadali@gmail.com"
