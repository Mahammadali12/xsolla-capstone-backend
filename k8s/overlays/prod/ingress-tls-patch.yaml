apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: xsolla-ingress
  namespace: xsolla
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - lms.example.com
        - api.lms.example.com
        - office.example.com
      secretName: xsolla-tls-cert
