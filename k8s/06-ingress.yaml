apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: xsolla-ingress
  namespace: xsolla
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  rules:
    - host: lms.minikube.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lms-frontend
                port:
                  number: 80
    - host: api.lms.minikube.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lms-api
                port:
                  number: 8080
    - host: office.minikube.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: office-frontend
                port:
                  number: 80
