apiVersion: v1
kind: Secret
metadata:
  name: xsolla-secrets
  namespace: xsolla
type: Opaque
stringData:
  # Database Credentials & Connection Strings
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  DATABASE_URL: "host=postgres port=5432 user=postgres password=postgres dbname=lms sslmode=disable"
  NOTIFY_DATABASE_URL: "host=postgres port=5432 user=notify password=notify dbname=notify sslmode=disable"
  EXPLORER_DATABASE_URL: "postgres://postgres:postgres@postgres:5432/xsolla_explorer?sslmode=disable"

  # Message Broker
  RABBITMQ_URL: "amqp://lms:lms@rabbitmq:5672/"
  RABBITMQ_DEFAULT_USER: "lms"
  RABBITMQ_DEFAULT_PASS: "lms"

  # Auth Secrets
  JWT_ACCESS_SECRET: "dev-access-secret-change-me-in-production"
  JWT_REFRESH_SECRET: "dev-refresh-secret-change-me-in-production"

  # S3 Object Storage (Supabase S3 gateway or AWS compatible)
  S3_ENDPOINT: "https://your-supabase-ref.storage.supabase.co/storage/v1/s3"
  S3_BUCKET: "lms-files"
  S3_REGION: "ap-south-1"
  S3_ACCESS_KEY: "REPLACE_ME_S3_ACCESS_KEY"
  S3_SECRET_KEY: "REPLACE_ME_S3_SECRET_KEY"

  # Google OAuth
  GOOGLE_OAUTH_CLIENT_ID: "REPLACE_ME.apps.googleusercontent.com"
  GOOGLE_OAUTH_CLIENT_SECRET: "REPLACE_ME_GOOGLE_SECRET"
  GOOGLE_OAUTH_REDIRECT_URI: "http://api.lms.minikube.local/auth/google/callback"
  GOOGLE_TOKEN_ENCRYPTION_KEY: "REPLACE_ME_32BYTE_BASE64_KEY="
  GOOGLE_OAUTH_FRONTEND_REDIRECT_URI: "http://lms.minikube.local/settings"

  # Gemini AI
  GEMINI_API_KEY: "REPLACE_ME_GEMINI_KEY"
  GEMINI_MODEL: "gemini-3.6-flash"

  # SMTP (Optional - empty host falls back to worker log output)
  SMTP_HOST: ""
  SMTP_PORT: ""
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
  SMTP_FROM: ""
