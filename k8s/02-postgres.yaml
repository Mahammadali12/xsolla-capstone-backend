apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: xsolla
data:
  00-create-dbs.sh: |
    #!/bin/bash
    set -e

    echo "[initdb] Creating secondary roles and databases..."
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        DO \$\$
        BEGIN
            IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'lms') THEN
                CREATE ROLE lms WITH LOGIN PASSWORD 'lms';
            END IF;
            IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'notify') THEN
                CREATE ROLE notify WITH LOGIN PASSWORD 'notify';
            END IF;
        END
        \$\$;

        SELECT 'CREATE DATABASE lms OWNER lms'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'lms')\gexec

        SELECT 'CREATE DATABASE notify OWNER notify'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'notify')\gexec

        SELECT 'CREATE DATABASE xsolla_explorer OWNER postgres'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'xsolla_explorer')\gexec

        GRANT ALL PRIVILEGES ON DATABASE lms TO lms;
        GRANT ALL PRIVILEGES ON DATABASE notify TO notify;
        GRANT ALL PRIVILEGES ON DATABASE notify TO lms;
        GRANT ALL PRIVILEGES ON DATABASE xsolla_explorer TO postgres;
    EOSQL

    echo "[initdb] Applying Office Explorer schema into xsolla_explorer..."
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "xsolla_explorer" -f /etc/postgres-init-sql/001_init_schema.up.sql

    echo "[initdb] Seeding Office Explorer zones into xsolla_explorer..."
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "xsolla_explorer" -f /etc/postgres-init-sql/002_seed_crescent_office.up.sql

    echo "[initdb] Multi-database initialization complete."

  001_init_schema.up.sql: |
    -- Enable pgcrypto for UUID generation if needed
    CREATE EXTENSION IF NOT EXISTS "pgcrypto";

    -- 1. ZONES TABLE
    CREATE TABLE IF NOT EXISTS zones (
        id VARCHAR(50) PRIMARY KEY,
        name VARCHAR(100) NOT NULL,
        is_locked_default BOOLEAN NOT NULL DEFAULT FALSE,
        difficulty VARCHAR(20) NULL,
        media_url TEXT NOT NULL,
        description TEXT NOT NULL,
        CONSTRAINT chk_zone_difficulty CHECK (
            (is_locked_default = TRUE AND difficulty IN ('EASY', 'MEDIUM', 'MEDIUM_HARD', 'HARD'))
            OR
            (is_locked_default = FALSE AND difficulty IS NULL)
        )
    );

    -- 2. QUESTS TABLE
    CREATE TABLE IF NOT EXISTS quests (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        zone_id VARCHAR(50) NOT NULL UNIQUE REFERENCES zones(id) ON DELETE CASCADE,
        title VARCHAR(200) NOT NULL,
        problem_statement TEXT NOT NULL,
        code_blocks JSONB NOT NULL,
        correct_order JSONB NOT NULL
    );

    -- 3. HOTSPOTS TABLE
    CREATE TABLE IF NOT EXISTS hotspots (
        id VARCHAR(50) PRIMARY KEY,
        zone_id VARCHAR(50) NULL REFERENCES zones(id) ON DELETE CASCADE,
        category VARCHAR(30) NOT NULL,
        x_percent NUMERIC(5,2) NOT NULL,
        y_percent NUMERIC(5,2) NOT NULL,
        title VARCHAR(100) NOT NULL,
        content TEXT NOT NULL,
        CONSTRAINT chk_hotspot_category CHECK (
            category IN ('COFFEE_MACHINE', 'FRIDGE', 'DISPENSER', 'PROJECTOR', 'VIEWPOINT', 'EASTER_EGG')
        ),
        CONSTRAINT chk_hotspot_coordinates CHECK (
            x_percent >= 0.00 AND x_percent <= 100.00 AND
            y_percent >= 0.00 AND y_percent <= 100.00
        )
    );

    CREATE INDEX IF NOT EXISTS idx_hotspots_zone_id ON hotspots(zone_id);

    -- 4. USER PROGRESS TABLE
    CREATE TABLE IF NOT EXISTS user_progress (
        user_id UUID PRIMARY KEY,
        unlocked_zones JSONB NOT NULL DEFAULT '[]'::jsonb,
        found_eggs JSONB NOT NULL DEFAULT '[]'::jsonb,
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_user_progress_unlocked_zones ON user_progress USING GIN (unlocked_zones);
    CREATE INDEX IF NOT EXISTS idx_user_progress_found_eggs ON user_progress USING GIN (found_eggs);

  002_seed_crescent_office.up.sql: |
