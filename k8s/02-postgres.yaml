    INSERT INTO quests (zone_id, title, problem_statement, code_blocks, correct_order) VALUES
        ('zone_gameroom_1', 'Sector 1 (Easy): Swap Two Values', 'Arrange the Go code blocks in the correct order to swap two integer values a and b.',
         '[{"id": "b1", "code": "func Swap(a, b int) (int, int) {"}, {"id": "b2", "code": "    temp := a"}, {"id": "b3", "code": "    a = b"}, {"id": "b4", "code": "    b = temp"}, {"id": "b5", "code": "    return a, b\n}"}]'::jsonb,
         '["b1", "b2", "b3", "b4", "b5"]'::jsonb),
        ('zone_gameroom_2', 'Sector 2 (Medium): Find Maximum Score', 'Arrange the code blocks to find and return the maximum value in an integer slice.',
         '[{"id": "b1", "code": "func MaxScore(scores []int) int {"}, {"id": "b2", "code": "    maxVal := scores[0]"}, {"id": "b3", "code": "    for _, s := range scores[1:] {"}, {"id": "b4", "code": "        if s > maxVal { maxVal = s }"}, {"id": "b5", "code": "    }"}, {"id": "b6", "code": "    return maxVal\n}"}]'::jsonb,
         '["b1", "b2", "b3", "b4", "b5", "b6"]'::jsonb),
        ('zone_gameroom_3', 'Sector 3 (Medium-Hard): Binary Search', 'Order the blocks to perform a binary search on a sorted slice of integers.',
