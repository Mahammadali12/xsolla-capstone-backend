        ('zone_meeting_8', 'Meeting Room 8', FALSE, NULL, '/assets/rooms/meeting_8.jpg', 'Meeting room for team syncs and calls. Book via calendar before use.'),
        ('zone_meeting_9', 'Meeting Room 9', TRUE, 'EASY', '/assets/rooms/meeting_9.jpg', 'Presentation meeting room equipped with a projector.'),
