         '["b1", "b2", "b3", "b4", "b5", "b6"]'::jsonb),
        ('zone_gameroom_4', 'Sector 4 (Hard): Worker Pool Dispatcher', 'Arrange the Go concurrency blocks to start workers, send jobs, close the channel, and wait for completion.',
         '[{"id": "b1", "code": "jobs := make(chan int, len(tasks))"}, {"id": "b2", "code": "var wg sync.WaitGroup"}, {"id": "b3", "code": "for w := 0; w < numWorkers; w++ {\n    wg.Add(1)\n    go worker(jobs, &wg)\n}"}, {"id": "b4", "code": "for _, t := range tasks {\n    jobs <- t\n}"}, {"id": "b5", "code": "close(jobs)"}, {"id": "b6", "code": "wg.Wait()"}]'::jsonb,
         '["b1", "b2", "b3", "b4", "b5", "b6"]'::jsonb),
        ('zone_meeting_1', 'Meeting Room 1 (Easy): Sum Two Numbers', 'Arrange the Go function lines in the right order to return the sum of a and b.',
