         '["b1", "b2", "b3", "b4"]'::jsonb),
        ('zone_meeting_5', 'Meeting Room 5 (Easy): Check Positive Number', 'Arrange the lines to return true when n is greater than zero.',
         '[{"id": "b1", "code": "func IsPositive(n int) bool {"}, {"id": "b2", "code": "    return n > 0"}, {"id": "b3", "code": "}"}]'::jsonb,
         '["b1", "b2", "b3"]'::jsonb),
        ('zone_meeting_9', 'Meeting Room 9 (Easy): Print Greeting', 'Order the lines to define a greeting variable and print it.',
         '[{"id": "b1", "code": "func Greet() {"}, {"id": "b2", "code": "    msg := \"Welcome to Xsolla\""}, {"id": "b3", "code": "    fmt.Println(msg)"}, {"id": "b4", "code": "}"}]'::jsonb,
         '["b1", "b2", "b3", "b4"]'::jsonb);

