services:
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: notification-rabbitmq
    restart: unless-stopped
    environment:
      # Dev-only credentials. RabbitMQ rejects the default guest user from other containers.
      RABBITMQ_DEFAULT_USER: lms
      RABBITMQ_DEFAULT_PASS: lms
    ports:
      - "5672:5672"
      - "15672:15672" # management UI: http://localhost:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  db:
    image: postgres:16-alpine
    container_name: notification-db
    restart: unless-stopped
    environment:
      # Dev-only credentials, independent from the LMS database.
      POSTGRES_USER: notify
      POSTGRES_PASSWORD: notify
      POSTGRES_DB: notify
    ports:
      - "5433:5432" # 5432 is the LMS Postgres
    volumes:
      - notification_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notify -d notify"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build: .
    container_name: notification-worker
    restart: unless-stopped
    # Compose needs this file to exist; copy .env.example to .env.
    env_file: .env
    environment:
      HEALTH_ADDR: ":8081"
      RABBITMQ_URL: amqp://lms:lms@rabbitmq:5672/
      DATABASE_URL: host=db port=5432 user=notify password=notify dbname=notify sslmode=disable
      POLICIES_PATH: /app/config/policies.json
      TEMPLATES_PATH: /app/templates
    # Policies and templates are configuration, not code: edit the files and
    # restart the worker.
    volumes:
      - ./config:/app/config:ro
      - ./config/templates:/app/templates:ro
    ports:
      - "8081:8081"
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy
    # Liveness only: a broker outage must not make Docker restart the worker.
    healthcheck:
      test: ["CMD-SHELL", "wget -qS -O /dev/null http://localhost:8081/healthz 2>&1 | grep -q 'HTTP/'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  rabbitmq_data:
  notification_db_data:
