info:
  name: Change my password
  type: http
  seq: 10

http:
  method: POST
  url: http://localhost:8080/auth/password-reset
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: inherit
  body:
    type: json
    content: |-
      {
        "old_password": "secret123",
        "new_password": "Str0ng-Passphrase!"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
