info:
  name: Reset a password
  type: http
  seq: 11

http:
  method: POST
  url: http://localhost:8080/auth/reset
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit
  body:
    type: json
    content: |-
      {
        "email": "alice@example.com",
        "old_password": "secret123",
        "new_password": "Str0ng-Passphrase!"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
