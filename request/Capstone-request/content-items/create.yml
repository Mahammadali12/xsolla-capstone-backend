info:
  name: Create content item
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/modules/2/content-items
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "type": "assignment",
        "title": "independent-assignment",
        "position": 1,
        "is_visible": true,
        "parent_id": null
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
