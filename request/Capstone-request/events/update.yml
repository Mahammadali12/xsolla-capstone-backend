info:
  name: Update event (attach module 1)
  type: http
  seq: 4

http:
  method: PATCH
  url: http://localhost:8080/events/2
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "title": "Updated Lecture",
        "location": "Building A",
        "module_id": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
