info:
  name: Create course
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/courses
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: file
    data:
      - filePath: ""
        contentType: ""
        selected: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
