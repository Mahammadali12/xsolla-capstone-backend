info:
  name: Student selector (admin)
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:8080/analytics/students?limit=20
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
