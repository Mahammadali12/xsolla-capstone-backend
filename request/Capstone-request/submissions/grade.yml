info:
  name: Grade submission
  type: http
  seq: 4

http:
  method: POST
  url: http://localhost:8080/submissions/2/grade
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "grade": 100,
        "feedback": "GOOD JOB!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
