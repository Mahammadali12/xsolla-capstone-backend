info:
  name: Create submission
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/modules/1/content-items/1/submissions
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "text_body": "This is my homework for HW-2.",
        "file_ids": [1]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
