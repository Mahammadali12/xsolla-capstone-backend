info:
  name: Create user
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8080/users
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "email": "newuser5@xsolla.com",
        "name": "New User",
        "password": "Secret123",
        "roles": ["student"]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
