info:
  name: Replace user roles
  type: http
  seq: 5

http:
  method: PUT
  url: http://localhost:8080/users/2/roles
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "roles": ["admin","mentor"],
        "expires_at": {
          "mentro": null
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
