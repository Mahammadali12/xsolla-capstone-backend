info:
  name: My look and accessibility settings
  type: http
  seq: 5

http:
  method: GET
  url: http://localhost:8080/users/me/preferences
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
